<script>AF_initDataCallback({key: 'ds:3', hash: '7', data:[[["/m/07zmbvf","Apple","Apple Inc. is an American multinational technology company headquartered in Cupertino, California, in Silicon Valley, and known for consumer electronics, software and online services. Founded in 1976 as Apple Computer Company by Steve Jobs, Steve Wozniak and Ronald Wayne, the company was incorporated by Jobs and Wozniak as Apple Computer, Inc. the following year. Its current name was adopted in 2007 as the company expanded its focus from computers to consumer electronics. Apple is one of the Big Tech companies.\nThe company was founded to market Wozniak's Apple I computer. Its successor, the Apple II, became one of the first successful mass-produced personal microcomputers. Apple introduced the Lisa in 1983 and the Macintosh in 1984, popularizing graphical user interfaces navigated by a mouse. By 1985, internal conflicts led to Jobs leaving the company to form NeXT, while Wozniak had assumed a less active role for personal reasons. During the 1990s, Apple lost considerable market share to lower-priced Wintel computers, Intel-powered PC clones running Windows.",["Cupertino","California","United States","US","One Apple Park Way"],[1976,4,1],"John Ternus",166000,4.842494830169678E12,338.32,325.58,334.5,325.33,351.73,243.42,36283672,"USD",36.953632,0.3254875,39698332,8.97909,1.0733,14594180000,null,"USD","NASDAQ",3,3,1,2,null,"https://en.wikipedia.org/wiki/Apple_Inc.",null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,2,2,2,2,2,3,0,null,null,null,null,null,null,null,null,null,null,null,null,0,0,0,0,0,[2026,8,10,4,null,null,null,[]],"Computers, Peripherals, and Software"]]], sideChannel: {}});</script>
